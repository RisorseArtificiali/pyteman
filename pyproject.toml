[project]
name = "pyteman"
version = "0.1.0"
description = "Rule-based runtime fault injection for Python, inspired by Byteman"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Paolo Antinori" }]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]
keywords = ["fault-injection", "testing", "chaos", "byteman", "sqlite", "reproducer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/paoloantinori/pyteman"
Repository = "https://github.com/paoloantinori/pyteman"
Issues = "https://github.com/paoloantinori/pyteman/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyteman = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
