[project]
name = "pyteman"
version = "0.2.0"
description = "Rule-based runtime fault injection for Python, inspired by Byteman"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Paolo Antinori" }]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]
keywords = ["fault-injection", "testing", "chaos", "byteman", "sqlite", "reproducer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/RisorseArtificiali/pyteman"
Repository = "https://github.com/RisorseArtificiali/pyteman"
Issues = "https://github.com/RisorseArtificiali/pyteman/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyteman = ["py.typed"]

[dependency-groups]
test = [
    "pytest>=9.0",
    "setuptools>=68",
    "PyYAML>=6.0",
]
dev = [
    {include-group = "test"},
    "coverage>=7.13.0",
    "ruff==0.16.8",
    "basedpyright==1.40.1",
    "prek==0.5.3",
    "validate-pyproject==0.26",
    "types-PyYAML",
]

[tool.ruff]
target-version = "py311"
extend-exclude = [".claude", "backlog", "build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Read by scripts/run_coverage.py and by nothing else: the ordinary suite runs
# uninstrumented, on purpose. Reasoning in docs/coverage.md.
[tool.coverage.run]
# Matched by FILENAME, which is the only channel that can see the activation
# hook: it is imported as top-level `sitecustomize`, so no name-prefix test
# against `pyteman` will ever match it. The path is relative and coverage
# resolves it against the working directory of the process that starts the
# measurement, which is why the driver pins its own cwd to the project root.
#
# source_pkgs = ["pyteman"] was measured here and removed. It matches by module
# NAME, and several tests build a fake package called pyteman in a temporary
# directory to check what the hook refuses, so it added those fixtures to the
# report as though they were this project's code: 1232 statements against 1185,
# with every real module reporting identically either way.
source = ["src/pyteman"]
branch = true
# The suite is almost entirely subprocesses, so a single data file would be
# written by many processes at once.
parallel = true
# What makes those subprocesses measurable at all. `subprocess` carries the
# configuration into children; `_exit` installs the handler that flushes data
# before os._exit, which otherwise skips atexit and loses everything the child
# measured. Requires coverage 7.13.0 or newer, which is the first release whose
# wheel carries the process-startup hook at the archive root where an installer
# will place it. Checked by scripts/run_coverage.py, which explains the two
# earlier releases that look close enough and are not.
patch = ["subprocess", "_exit"]
